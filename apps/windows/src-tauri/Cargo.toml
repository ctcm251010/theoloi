[package]
name = "audiotp-windows"
version = "1.0.0"
description = "AudioTP Windows private online audio client"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "AudioTP"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
