[package]
name = "audiotp-windows"
version = "1.1.0"
description = "AudioTP Windows private online audio client"
edition = "2021"
rust-version = "1.90"

[[bin]]
name = "AudioTP"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "=2.13.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
sha2 = "=0.10.9"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
